name: Claude Code
version: "0.2.3"
image: ghcr.io/drache42/ha-claude-code
slug: claude_code
description: Claude Code with full admin access to Home Assistant, controllable via Remote Control
url: https://github.com/drache42/ha-claude-addon
stage: experimental
arch:
  - amd64
  - aarch64
# Defaults relied on: boot: auto, startup: application, ingress_port: 8099,
# panel_admin: true (the linter rejects explicit default values).

# Full admin: Supervisor API (admin role) + Core API proxy. The add-on token
# (SUPERVISOR_TOKEN) is what the ha-api / ha-supervisor helpers use.
hassio_api: true
hassio_role: admin
homeassistant_api: true

# Live HA config is mounted read-write at /homeassistant_config (the Claude
# working directory). Everything else an admin edits is mapped too.
map:
  - type: homeassistant_config
    read_only: false
  - type: all_app_configs
    read_only: false
  - type: local_apps
    read_only: false
  - type: ssl
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
  - type: backup
    read_only: false

# Web terminal for first-time login and re-login (Remote Control needs a
# full-scope claude.ai login; setup-token / API keys do not work).
ingress: true
panel_icon: mdi:robot
panel_title: Claude Code

# Keep the OAuth credentials out of HA backups (backups go to OneDrive).
backup_exclude:
  - "**/.credentials.json"

options:
  permission_mode: default
schema:
  permission_mode: list(default|acceptEdits|plan)
  node_red_mcp_url: str?
  zabbix_server: str?
  zabbix_host: str?
