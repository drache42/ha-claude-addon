# Ingress front for the ttyd web terminal. Only the Supervisor ingress proxy
# (172.30.32.2) may connect; ttyd itself listens on 127.0.0.1 only, so other
# add-ons on the hassio network cannot reach a root shell.
daemon off;
pid /run/nginx-claude.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
