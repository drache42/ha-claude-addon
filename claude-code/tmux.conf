# Mouse capture stays OFF: with it on, tmux swallows the browser's right-click
# menu and paste, which breaks pasting the login code into `claude auth login`.
# Scroll back with Ctrl-b [ (then PageUp / arrows, q to leave).
set -g mouse off
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g status-style "bg=colour236,fg=colour250"
